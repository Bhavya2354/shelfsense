[project]
name = "shelfsense"
version = "0.1.0"
description = "Demand forecasting and replenishment planning for grocery retail."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "polars>=2.0.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "tenacity>=9.2.1",
    "truststore>=0.10.4",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
shelfsense = "app.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "ruff>=0.8",
]
pipeline = [
    "chronos-forecasting>=2.3.2",
    "hierarchicalforecast>=1.5.3",
    "lightgbm>=4.7.0",
    "neuralforecast>=3.3.0",
    "optuna>=5.0.0",
    "scipy>=1.18.1",
    "statsforecast>=2.1.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "PTH", "PL", "TRY", "S"]
# PLC0415: heavy training libraries are imported lazily so the API process stays slim.
ignore = ["PLR0913", "TRY003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# FastAPI injects dependencies through handler parameters.
"app/api/routes/**" = ["PLR0917"]
"migrations/**" = ["S608", "E501"]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# numpy reductions are typed as Any; flagging every return of one adds noise, not safety.
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a Postgres database (TEST_DATABASE_URL)"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*", "statsforecast.*", "neuralforecast.*", "hierarchicalforecast.*", "chronos.*", "optuna.*"]
ignore_missing_imports = true

[tool.uv]
# The API image installs only the main dependencies; local work gets everything.
default-groups = ["dev", "pipeline"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
