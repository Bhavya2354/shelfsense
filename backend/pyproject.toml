[project]
name = "shelfsense"
version = "0.1.0"
description = "Demand forecasting and replenishment planning for grocery retail."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tenacity>=9.2.1",
    "truststore>=0.10.4",
    "typer>=0.12",
]

[project.scripts]
shelfsense = "app.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]
pipeline = [
    "kaggle>=2.2.4",
    "py7zr>=1.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "PTH", "PL", "TRY", "S"]
# PLC0415: heavy training libraries are imported lazily so the API process stays slim.
ignore = ["PLR0913", "TRY003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[[tool.mypy.overrides]]
module = ["kaggle.*", "py7zr.*"]
ignore_missing_imports = true
